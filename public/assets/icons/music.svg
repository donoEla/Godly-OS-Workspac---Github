<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="musicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <filter id="glowMusic" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#musicBg)"/>
  <rect x="3" y="3" width="94" height="94" rx="21" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <!-- Musical note pair -->
  <path d="M36 64 A 8 8 0 1 1 36 48 A 8 8 0 0 1 36 64 M64 56 A 8 8 0 1 1 64 40 A 8 8 0 0 1 64 56" fill="none"/>
  <ellipse cx="32" cy="62" rx="7" ry="5.5" transform="rotate(-18 32 62)" fill="#ffffff" filter="url(#glowMusic)"/>
  <ellipse cx="62" cy="54" rx="7" ry="5.5" transform="rotate(-18 62 54)" fill="#ffffff" filter="url(#glowMusic)"/>
  <rect x="36" y="28" width="4.5" height="34" rx="2" fill="#ffffff"/>
  <rect x="66" y="20" width="4.5" height="34" rx="2" fill="#ffffff"/>
  <!-- Connecting beam -->
  <polygon points="36,33 70.5,25 70.5,31 36,39" fill="#ffffff" filter="url(#glowMusic)"/>
  <!-- Soundwaves -->
  <path d="M20 48 Q22 45 20 42" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M16 52 Q20 45 16 38" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M80 38 Q82 35 80 32" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M84 42 Q88 35 84 28" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>