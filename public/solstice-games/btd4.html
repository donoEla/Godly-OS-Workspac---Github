<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="x-ua-compatible" content="ie=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"><title>Bloons Tower Defense 4</title>
<style>
html,body{margin:0;padding:0;background:black;overflow:hidden;height:100%;width:100%}
#flash-container{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:black;overflow:hidden}
.black-box{position:fixed;background:black;z-index:10}
#box-top{top:0;left:0;width:100%;height:0}#box-bottom{bottom:0;left:0;width:100%;height:0}
#box-left{top:0;left:0;width:0;height:100%}#box-right{top:0;right:0;width:0;height:100%}
ruffle-player{width:100%;height:100%;background:black;display:block}
</style>
<script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.2.0-nightly.2025.10.2/ruffle.min.js"></script></head><body>
<div id="flash-container"></div>
<div class="black-box" id="box-top"></div><div class="black-box" id="box-bottom"></div>
<div class="black-box" id="box-left"></div><div class="black-box" id="box-right"></div>
<script>
const container=document.getElementById("flash-container");
const boxTop=document.getElementById("box-top"),boxBottom=document.getElementById("box-bottom"),boxLeft=document.getElementById("box-left"),boxRight=document.getElementById("box-right");
function resizeGame(){
  const ww=window.innerWidth,wh=window.innerHeight,ar=5.5/3;
  let w=Math.floor(ww),h=Math.floor(w/ar);
  if(h>wh){h=Math.floor(wh);w=Math.floor(h*ar);}
  container.style.width=w+"px";container.style.height=h+"px";
  const tm=(wh-h)/2,lm=(ww-w)/2;
  boxTop.style.height=tm+"px";boxBottom.style.height=tm+"px";boxLeft.style.width=lm+"px";boxRight.style.width=lm+"px";
}
window.addEventListener("resize",resizeGame);
window.addEventListener("DOMContentLoaded",()=>{
  resizeGame();
  const ruffle=window.RufflePlayer&&(window.RufflePlayer.newest());
  if(ruffle&&container){
    const player=ruffle.createPlayer();
    player.style.width="100%";player.style.height="100%";player.style.background="black";
    container.appendChild(player);
    player.load("https://cdn.jsdelivr.net/gh/QiProject/flash-games@8a30ea684498b868a7b1cd188bd860ba2042eb56/Bloons-Tower-Defense-4.swf");
  }else{container.textContent="Ruffle failed to load.";}
});
</script></body></html>
