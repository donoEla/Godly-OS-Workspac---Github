<!DOCTYPE html><html lang="en" dir="ltr"><head><meta charset="UTF-8"><title>Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden}
.webgl-content,#gameContainer{width:100%;height:100%;position:absolute;top:0;left:0}
#gameContainer canvas{width:100%;height:100%;display:block}
.logo{display:none!important}
.progress{position:absolute;left:50%;top:60%;width:200px;margin-left:-100px;height:10px;background:#333}
.progress .empty{background:#333;height:100%}
.progress .full{background:#fff;height:100%}
</style></head><body>
<script src="https://cdn.jsdelivr.net/gh/n-101-1/1@main/UnityProgress.js"></script>
<script src="https://cdn.jsdelivr.net/gh/n-101-1/1@main/2.7.js"></script>
<script>
var gameInstance;
window.onload=function(){gameInstance=UnityLoader.instantiate("gameContainer","https://cdn.jsdelivr.net/gh/n-101-1/1@main/2.7.json",{onProgress:UnityProgress,Module:{onRuntimeInitialized:function(){UnityProgress(gameInstance,"complete");}}});};
</script>
<div class="webgl-content"><div id="gameContainer"></div></div>
<script src="https://cdn.jsdelivr.net/gh/n-101-1/1@main/1firebase-app.js"></script>
<script src="https://cdn.jsdelivr.net/gh/n-101-1/1@main/1firebase-auth.js"></script>
<script src="https://cdn.jsdelivr.net/gh/n-101-1/1@main/1firebase-firestore.js"></script>
<script src="https://cdn.jsdelivr.net/gh/n-101-1/1@main/1firebase.js"></script>
<script src="https://cdn.jsdelivr.net/gh/n-101-1/1@main/1login.js?v=2"></script>
<script src="https://cdn.jsdelivr.net/gh/n-101-1/1@main/1firestore.js"></script>
<script>
initializeFireBase();
function showAds(){console.log("show ads");}
function requestNewAd(){unityAdFinishedCallback();}
function unityAdFinishedCallback(){try{if(gameInstance)gameInstance.SendMessage("AdsManager","OnWebCallback");}catch(error){console.log(error);}}
</script>
</body></html>
