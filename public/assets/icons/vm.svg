<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="vm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111e" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="vm-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="vm-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="vm-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="vm-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>
    <filter id="vm-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Icon Vessel -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#vm-bg)" stroke="url(#vm-rim)" stroke-width="1.5" />

  <!-- Hypervisor Isolation Boundary Grid -->
  <g opacity="0.35" stroke="#38bdf8" stroke-width="1" stroke-linecap="round">
    <!-- Top-left bracket -->
    <path d="M 22 34 L 22 22 L 34 22" fill="none" />
    <!-- Top-right bracket -->
    <path d="M 94 22 L 106 22 L 106 34" fill="none" />
    <!-- Bottom-left bracket -->
    <path d="M 22 94 L 22 106 L 34 106" fill="none" />
    <!-- Bottom-right bracket -->
    <path d="M 94 106 L 106 106 L 106 94" fill="none" />
  </g>

  <!-- Virtual Architecture Bus Guides -->
  <g opacity="0.2" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 3">
    <line x1="64" y1="16" x2="64" y2="34" />
    <line x1="64" y1="92" x2="64" y2="112" />
    <line x1="18" y1="62" x2="40" y2="62" />
    <line x1="88" y1="62" x2="110" y2="62" />
  </g>

  <!-- Layered Isometric Virtual Machine Core -->
  <g filter="url(#vm-glow)">
    <!-- Top Face -->
    <polygon points="64,32 90,47 64,62 38,47" fill="url(#vm-top)" />
    <!-- Left Face -->
    <polygon points="38,47 64,62 64,93 38,78" fill="url(#vm-left)" />
    <!-- Right Face -->
    <polygon points="64,62 90,47 90,78 64,93" fill="url(#vm-right)" />

    <!-- Isometric Coordinate Wireframe Edges -->
    <polygon points="64,32 90,47 64,62 38,47" fill="none" stroke="#bae6fd" stroke-width="1" opacity="0.6" />
    <polygon points="38,47 64,62 64,93 38,78" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4" />
    <polygon points="64,62 90,47 90,78 64,93" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.5" />
    
    <!-- Virtual Isolation Core Spark -->
    <circle cx="64" cy="62" r="4.5" fill="#ffffff" />
    <circle cx="64" cy="62" r="7.5" fill="none" stroke="#bae6fd" stroke-width="1" opacity="0.75" />
  </g>

  <!-- Sub-kernel activity status pip -->
  <circle cx="64" cy="112" r="2.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="22" cy="62" r="2" fill="#34d399" opacity="0.8" />
</svg>
