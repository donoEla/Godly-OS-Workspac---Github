<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="width:100vw;height:100vh;position:fixed;top:0;left:0;margin:0;padding:0;border:none;overflow:hidden;">
  <foreignObject width="100%" height="100%" style="width:100%;height:100%;border:none;margin:0;padding:0;overflow:hidden;pointer-events:auto;">
    <html xmlns="http://www.w3.org/1999/xhtml" lang="en" style="width:100%;height:100%;margin:0;padding:0;overflow:hidden;">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <title>Godly OS — Divine Operating System</title>
        <style>
          * { box-sizing: border-box; }
          html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #020617;
          }
          #godly-viewport {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            pointer-events: auto;
          }
          #godly-splash {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #0f0c1b 0%, #050509 100%);
            z-index: 10;
            transition: opacity 0.4s ease;
            pointer-events: none;
          }
          .spin-ring {
            width: 46px;
            height: 46px;
            border: 3px solid rgba(168, 85, 247, 0.2);
            border-top-color: #a855f7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
            box-shadow: 0 0 24px rgba(168, 85, 247, 0.35);
          }
          @keyframes spin {
            to { transform: rotate(360deg); }
          }
          .os-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
          }
          .os-status {
            font-size: 12px;
            color: #c084fc;
            margin-top: 6px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
          }
        </style>
      </head>
      <body>
        <div id="godly-splash">
          <div class="spin-ring"></div>
          <div class="os-title">Godly OS — Divine Edition</div>
          <div class="os-status" id="godly-status">Streaming Godly OS distribution bundle...</div>
        </div>
        <iframe id="godly-viewport" allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write; cross-origin-isolated" allowfullscreen="true"></iframe>
        <script><![CDATA[
          (async function () {
            const status = document.getElementById('godly-status');
            const splash = document.getElementById('godly-splash');
            const frame = document.getElementById('godly-viewport');

            function dismiss() {
              if (splash) {
                splash.style.opacity = '0';
                setTimeout(() => { splash.style.display = 'none'; }, 450);
              }
            }

            status.textContent = 'Launching celestial operating system...';
            const mirrorUrl = 'https://donoela.github.io/Godly-OS-Workspac---Github/';

            frame.onload = () => {
              setTimeout(dismiss, 350);
            };

            frame.src = mirrorUrl;
            setTimeout(dismiss, 2000);
          })();
        ]]></script>
      </body>
    </html>
  </foreignObject>
</svg>
