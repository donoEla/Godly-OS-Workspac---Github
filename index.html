<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Production Deployment Router: Automatically forward root GitHub Pages & static visits to compiled dist/ -->
    <script>
      (function() {
        var isLocalDev = ['localhost', '127.0.0.1'].includes(location.hostname) || (location.port && location.port === '5173');
        if (!isLocalDev && !location.pathname.includes('/dist/')) {
          var basePath = location.pathname.endsWith('/') ? location.pathname : location.pathname + '/';
          location.replace(basePath + 'dist/' + location.search + location.hash);
        }
      })();
    </script>
    <noscript>
      <meta http-equiv="refresh" content="0; url=./dist/" />
    </noscript>
    <link rel="icon" type="image/jpeg" href="./assets/icons/settings.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Godly OS — Divine Browser Operating System</title>
    <meta name="description" content="A breathtaking, production-quality browser-based luxury operating system with window management, interactive apps, and fluid motion." />
    <!-- Preconnect to Fonts & jsDelivr CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Ultraviolet & BareMux Proxy Engine (Portable for GitHub Pages & CDNs) -->
    <script src="./uv/uv.bundle.js"></script>
    <script src="./uv/uv.config.js"></script>
    <script src="./baremux/index.js"></script>
    <!-- Lumin SDK (Asynchronous with fallback) -->
    <script async src="https://cdn.jsdelivr.net/gh/luminsdk/script@latest/lumin.min.js" crossorigin="anonymous"></script>
  </head>
  <body class="overflow-hidden select-none bg-black text-slate-100 font-sans antialiased m-0 p-0">
    <div id="root" class="w-screen h-screen overflow-hidden"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
