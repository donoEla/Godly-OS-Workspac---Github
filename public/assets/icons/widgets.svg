<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="wd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#110d22" />
      <stop offset="50%" stop-color="#18132f" />
      <stop offset="100%" stop-color="#261b46" />
    </linearGradient>
    <linearGradient id="wd-top-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="wd-metric-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>
    <linearGradient id="wd-control-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="wd-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>
    <filter id="wd-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Icon Vessel -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#wd-bg)" stroke="url(#wd-rim)" stroke-width="1.5" />

  <!-- Spatial Component Composition -->
  <g filter="url(#wd-glow)">
    <!-- 1. Top Wide Widget Card (Chronometer/Header Pill) -->
    <rect x="22" y="24" width="84" height="34" rx="10" fill="url(#wd-top-card)" opacity="0.95" stroke="#c084fc" stroke-width="1" />
    <!-- Inset Display Elements -->
    <circle cx="38" cy="41" r="6" fill="#ffffff" opacity="0.9" />
    <circle cx="38" cy="41" r="2.5" fill="#4f46e5" />
    <rect x="52" y="38" width="38" height="6" rx="3" fill="#ffffff" opacity="0.4" />
    <circle cx="92" cy="41" r="3" fill="#a78bfa" />

    <!-- 2. Bottom-Left Metric Widget Card -->
    <rect x="22" y="66" width="38" height="38" rx="10" fill="url(#wd-metric-card)" opacity="0.95" stroke="#e879f9" stroke-width="1" />
    <!-- Gauge Arc Detail -->
    <path d="M 33 88 A 10 10 0 1 1 49 88" fill="none" stroke="#fbcfe8" stroke-width="3" stroke-linecap="round" />
    <circle cx="41" cy="85" r="2.5" fill="#ffffff" />

    <!-- 3. Bottom-Right Toggle / Modular Slider Card -->
    <rect x="68" y="66" width="38" height="38" rx="10" fill="url(#wd-control-card)" opacity="0.95" stroke="#38bdf8" stroke-width="1" />
    <!-- Slider Tracks -->
    <rect x="76" y="76" width="22" height="4" rx="2" fill="#0369a1" />
    <circle cx="88" cy="78" r="3.5" fill="#ffffff" />
    <rect x="76" y="88" width="22" height="4" rx="2" fill="#0369a1" />
    <circle cx="80" cy="90" r="3.5" fill="#7dd3fc" />
  </g>

  <!-- Spatial Alignment Nodes in Negative Space -->
  <circle cx="64" cy="62" r="1.5" fill="#c084fc" opacity="0.6" />
  <circle cx="18" cy="64" r="1.5" fill="#818cf8" opacity="0.4" />
  <circle cx="110" cy="64" r="1.5" fill="#818cf8" opacity="0.4" />
</svg>
